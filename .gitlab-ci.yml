# Pipeline de CI consolidado (VB-07): valida o projeto inteiro.
# Imagem alinhada ao Dockerfile/README (Python 3.12); ver docs/matriz-rastreabilidade-sprint3.md.
# Depende do ruff.toml geral introduzido na VB-06 (merge da MR !171 antes desta).
stages:
  - lint
  - test

variables:
  PYTHONPATH: src
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

lint:
  stage: lint
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  script:
    - pip install -r requirements-transformation-dev.txt
    - ruff check src scripts tests
    - ruff format --check src scripts tests

# Cobertura estendida a todo o ETL (VB-08), medida em 2026-09-10 com a suite completa
# (188 testes, --branch): extraction 91%, load 92%, transformation 95%,
# orchestration 0% (sem testes no develop), TOTAL 87%. Threshold 85%: multiplo de 5
# logo abaixo do medido, sem excluir modulos. orchestration/flow.py segue em 0% por
# falta de testes de flow (lacuna OV-09, registrada em docs/matriz-rastreabilidade-sprint3.md).
test:
  stage: test
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  script:
    - pip install -r requirements.txt -r requirements-transformation-dev.txt
    - python scripts/transformation/render_schema.py --check
    - coverage run --branch --source=etl -m unittest discover -s tests -v
    - coverage report --fail-under=85
    - coverage xml -o coverage-etl.xml
  coverage: '/TOTAL\s+\d+\s+\d+\s+\d+\s+\d+\s+(\d+%)/'
  artifacts:
    when: always
    paths:
      - coverage-etl.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage-etl.xml
