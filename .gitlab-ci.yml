# Pipeline de CI consolidado (VB-07): valida o projeto inteiro.
# Imagem alinhada ao Dockerfile/README (Python 3.12); ver docs/matriz-rastreabilidade-sprint3.md.
# Depende do ruff.toml geral introduzido na VB-06 (merge da MR !171 antes desta).
stages:
  - lint
  - test

# Runner institucional com capacidade confirmada na rodada CF-01.
default:
  tags:
    - inteli-gitlab-runner-prd

variables:
  PYTHONPATH: src
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

lint:
  stage: lint
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  script:
    - pip install -r requirements-transformation-dev.txt
    - ruff check src scripts tests
    - ruff format --check src scripts tests

# Cobertura estendida a todo o ETL (VB-08). Medida original em 2026-09-10 com a
# suite do develop (188 testes, --branch): extraction 91%, load 92%,
# transformation 95%, orchestration 0% (sem testes no develop), TOTAL 87%.
# Threshold 85%: multiplo de 5 logo abaixo do medido, sem excluir modulos.
# Apos a integracao da VB-05 (tests/orchestration), flow.py passou a ~88% e o
# TOTAL integrado a 93% (registro em docs/gate-final-sprint3.md).
test:
  stage: test
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  script:
    - pip install -r requirements.txt -r requirements-transformation-dev.txt
    - python scripts/architecture/validate_architecture_docs.py
    - python scripts/transformation/render_schema.py --check
    # Passada única: cobertura + JUnit juntos. Se um teste falhar, os XMLs
    # dos demais já foram gerados e o job falha (bloqueio mantido).
    - coverage run --branch --source=etl -m xmlrunner discover -s tests -o test-reports -v
    - coverage report --fail-under=85
    - coverage xml -o coverage-etl.xml
  coverage: '/TOTAL\s+\d+\s+\d+\s+\d+\s+\d+\s+(\d+%)/'
  artifacts:
    when: always
    paths:
      - coverage-etl.xml
      - test-reports/
    reports:
      junit: test-reports/*.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage-etl.xml
