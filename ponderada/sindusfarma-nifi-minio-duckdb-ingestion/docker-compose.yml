services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: sindusfarma-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?copy .env.example to .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?copy .env.example to .env}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: sindusfarma-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?copy .env.example to .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?copy .env.example to .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-sindusfarma-data}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\"; do
        sleep 2;
      done;
      mc mb --ignore-existing local/\"$${MINIO_BUCKET}\";
      mc anonymous set none local/\"$${MINIO_BUCKET}\";
      "

  nifi:
    image: apache/nifi:1.27.0
    container_name: sindusfarma-nifi
    depends_on:
      - minio
    environment:
      NIFI_WEB_HTTP_PORT: "8080"
      NIFI_JVM_HEAP_INIT: ${NIFI_JVM_HEAP_INIT:-512m}
      NIFI_JVM_HEAP_MAX: ${NIFI_JVM_HEAP_MAX:-1g}
      NIFI_SENSITIVE_PROPS_KEY: ${NIFI_SENSITIVE_PROPS_KEY:?copy .env.example to .env}
    ports:
      - "${NIFI_HTTP_PORT:-8080}:8080"
    volumes:
      - nifi_database_repository:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile_repository:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content_repository:/opt/nifi/nifi-current/content_repository
      - nifi_provenance_repository:/opt/nifi/nifi-current/provenance_repository
      - nifi_state:/opt/nifi/nifi-current/state
      - ./nifi/flows:/opt/nifi/flows
      - ./nifi/conf:/opt/nifi/local-conf
      - ./local/nifi-output:/opt/nifi/output
      - ${HOST_INPUT_DIR:-./local/input}:/opt/nifi/input:ro

volumes:
  minio_data:
  nifi_database_repository:
  nifi_flowfile_repository:
  nifi_content_repository:
  nifi_provenance_repository:
  nifi_state:
