# Ambiente local do ETL orquestrado (OV-02): MinIO como entrada e o runner
# Prefect/DuckDB. A Elastic Stack (observabilidade) é acrescentada no OV-07.
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  createbucket:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done &&
      mc mb --ignore-existing local/sindusfarma &&
      echo 'bucket sindusfarma pronto'"

  runner:
    build: .
    depends_on:
      - minio
    environment:
      ETL_MINIO_ENDPOINT: http://minio:9000
      ETL_MINIO_BUCKET: sindusfarma
      ETL_MINIO_ACCESS_KEY: minioadmin
      ETL_MINIO_SECRET_KEY: minioadmin
      ETL_MINIO_INPUT_PREFIX: landing
      ETL_MINIO_SECURE: "false"
      DUCKDB_PATH: /data/warehouse.duckdb
    volumes:
      - duck-data:/data
      - ./src:/app/src
      - ./scripts:/app/scripts

volumes:
  minio-data:
  duck-data:
