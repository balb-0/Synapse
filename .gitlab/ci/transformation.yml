# Gate de MG-10. VB-07 pode incluir este job no pipeline consolidado do grupo.
transformation-quality:
  stage: test
  image: python:3.11-slim
  variables:
    PYTHONPATH: src
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  script:
    - pip install -r requirements-transformation-dev.txt
    - ruff check --config ruff-transformation.toml src/etl/transformation tests/transformation scripts/transformation
    - ruff format --config ruff-transformation.toml --check src/etl/transformation tests/transformation scripts/transformation
    - python scripts/transformation/render_schema.py --check
    - coverage run --branch --source=etl.transformation -m unittest discover -s tests -v
    - coverage report --fail-under=90
    - coverage xml -o coverage-transformation.xml
  coverage: '/TOTAL\s+\d+\s+\d+\s+\d+\s+\d+\s+(\d+%)/'
  artifacts:
    when: always
    paths:
      - coverage-transformation.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage-transformation.xml
