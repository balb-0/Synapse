# Pipeline do coletor de telemetria do ETL (OB-07, ADR 0001).
#
# Entrada: GELF/UDP, alimentada pelo próprio driver de log `gelf` do Docker
# no serviço `runner` (docker-compose.yml) — não por um agente rodando
# dentro do container. O runner nunca conhece o Logstash.
#
# O driver GELF do Docker manda a linha de log inteira como `short_message`;
# o input `gelf` do Logstash já copia isso para o campo `message`. Como o
# runner só escreve JSON estruturado no stdout (etl.orchestration.logging_config,
# OB-03), o filtro `json` decodifica `message` de volta nos campos originais
# (event, stage, run_id, task_id, ...) em vez de indexar uma string opaca.
#
# Uma linha que não for JSON válido (ex.: traceback do próprio Python
# vazando pro stdout) não derruba o pipeline: fica com a tag
# `_jsonparsefailure` e o `message` original intacto, em vez de descartada.
input {
  gelf {
    port => 12201
  }
}

filter {
  json {
    source => "message"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "etl-logs-%{+YYYY.MM.dd}"
  }
}
