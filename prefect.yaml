# Deployments do ETL no Prefect Server local.
#
# A agenda completa `pipeline-completo/agendado-dw` (cron `0 3 * * *`) é servida pelo
# serviço scheduler via scripts/orchestration/deployment.py. Este arquivo
# também publica os caminhos manual de objeto, backfill tratado e manual DW.
#
# Publicação (com o ambiente no ar, a partir da raiz do repositório):
#   export PREFECT_API_URL=http://localhost:4200/api
#   prefect work-pool create default --type process   # idempotente
#   prefect deploy --all
deployments:
  - name: manual
    entrypoint: src/etl/orchestration/flow.py:ingest_object
    parameters:
      source: empresas
      bucket: sindusfarma
      key: landing/empresas.csv
    tags: [etl, ingest]
    # O worker roda no contêiner `runner`: o código vive em `/app`.
    pull:
      - prefect.deployments.steps.set_working_directory:
          directory: /app
    work_pool:
      name: default
  - name: backfill
    entrypoint: src/etl/orchestration/flow.py:backfill
    parameters:
      sources: [empresas]
      bucket: sindusfarma
      prefix: landing
    tags: [etl, backfill]
    pull:
      - prefect.deployments.steps.set_working_directory:
          directory: /app
    work_pool:
      name: default

  - name: manual-dw
    entrypoint: src/etl/orchestration/pipeline.py:run_pipeline
    parameters:
      sources: [pesquisas, empresas, clientes, questoes, respondentes, respostas]
      publish_dir: /data/publicacao
    tags: [etl, backfill, analytics]
    pull:
      - prefect.deployments.steps.set_working_directory:
          directory: /app
    work_pool:
      name: default
