# Deployments do ETL no Prefect Server local.
#
# Publicação (com o ambiente no ar):
#   docker compose up -d
#   docker compose exec runner prefect deploy --all
#
# O `scheduler` do `docker-compose.yml` já serve o deployment `agendado`
# via `scripts/orchestration/deployment.py`; este arquivo declara os mesmos
# deployments para publicação explícita pela CLI e para a execução manual
# parametrizada pela UI (`ingest-object` / `backfill`).
deployments:
  - name: agendado
    entrypoint: src/etl/orchestration/flow.py:ingest_object
    parameters:
      source: empresas
      bucket: sindusfarma
      key: landing/empresas.csv
    schedules:
      - cron: "0 3 * * *"
        timezone: America/Sao_Paulo
    tags: [etl, ingest]
  - name: manual
    entrypoint: src/etl/orchestration/flow.py:ingest_object
    parameters:
      source: empresas
      bucket: sindusfarma
      key: landing/empresas.csv
    tags: [etl, ingest]
  - name: backfill
    entrypoint: src/etl/orchestration/flow.py:backfill
    parameters:
      sources: [empresas]
      bucket: sindusfarma
      prefix: landing
    tags: [etl, backfill]
