# Deployments do ETL no Prefect Server local.
#
# O deployment agendado (`ingest-object/agendado`, cron `0 3 * * *`) é servido
# pelo serviço `scheduler` via `scripts/orchestration/deployment.py`; este
# arquivo declara os deployments para publicação explícita pela CLI e para a
# execução manual parametrizada pela UI (`ingest-object/manual`, `backfill`).
#
# Publicação (com o ambiente no ar, a partir da raiz do repositório):
#   export PREFECT_API_URL=http://localhost:4200/api
#   prefect work-pool create default --type process   # idempotente
#   prefect deploy --all
deployments:
  - name: manual
    entrypoint: src/etl/orchestration/flow.py:ingest_object
    parameters:
      source: empresas
      bucket: sindusfarma
      key: landing/empresas.csv
    tags: [etl, ingest]
    # O worker roda no contêiner `runner`: o código vive em `/app`.
    pull:
      - prefect.deployments.steps.set_working_directory:
          directory: /app
    work_pool:
      name: default
  - name: backfill
    entrypoint: src/etl/orchestration/flow.py:backfill
    parameters:
      sources: [empresas]
      bucket: sindusfarma
      prefix: landing
    tags: [etl, backfill]
    pull:
      - prefect.deployments.steps.set_working_directory:
          directory: /app
    work_pool:
      name: default
